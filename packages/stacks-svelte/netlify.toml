[build]
  base = "/" # Note: You'll need to set the "Package Directory" from the Netlify UI
  publish = "packages/stacks-svelte/netlify/dist"
  command = "npm run storybook:build -w packages/stacks-svelte"
  # don't build deploy previews on PRs opened by dependabot
  ignore = "git log -1 --pretty=%B | grep dependabot"
  

[build.environment]
  # IMPORTANT!: Git LFS settings can't be changed in the .toml file. You will need to set this environment 
  # variable through the Netlify UI otherwise netlify won't be able to clone the repo due to all our images.
  # https://docs.netlify.com/build/configure-builds/environment-variables/#netlify-configuration-variables
  GIT_LFS_ENABLED = "true" # just here as a reminder

[[redirects]]
  from = "https://beta.svelte.stackoverflow.design/*"
  to = "https://svelte.stackoverflow.design/:splat"
  status = 301
  force = true

# Add v0 as a production domain alias only after these rules are deployed.
# Upgrade explicitly: Netlify's automatic HTTPS redirect may not apply to proxies.
[[redirects]]
  from = "http://v0.svelte.stackoverflow.design/*"
  to = "https://v0.svelte.stackoverflow.design/:splat"
  status = 301
  force = true

# Keep the v2 branch deploy enabled: it remains the legacy content source.
# Use its Netlify hostname, not a custom domain that may redirect back to v0.
[[redirects]]
  from = "https://v0.svelte.stackoverflow.design/*"
  to = "https://v2--stacks-svelte.netlify.app/:splat"
  status = 200
  force = true
